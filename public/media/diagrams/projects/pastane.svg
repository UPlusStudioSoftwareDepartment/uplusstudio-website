    <g class="s1"><rect x="40" y="80" width="22" height="250" fill="#7fa6c9" fill-opacity=".6"/><path d="M40 80h22v250H40zM40 200h22" fill="none" stroke="#121110" stroke-width="3"/></g>
    <g class="s2"><rect x="180" y="230" width="220" height="100" fill="#b07a4f"/><rect x="180" y="186" width="220" height="44" fill="#7fa6c9" fill-opacity=".3" stroke="#7fa6c9" stroke-width="2"/><g class="glow" fill="#f2c46b"><circle cx="215" cy="214" r="9"/><circle cx="255" cy="214" r="9"/><circle cx="295" cy="214" r="9"/><circle cx="335" cy="214" r="9"/><circle cx="370" cy="214" r="9"/></g></g>
    <g class="s3"><rect x="450" y="250" width="130" height="80" fill="#d8d3cb"/><path d="M466 262l30 26M530 258l30 46" stroke="#a9a39a" stroke-width="1.5"/></g>
