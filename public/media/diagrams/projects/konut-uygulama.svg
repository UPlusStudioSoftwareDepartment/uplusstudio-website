<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img"><title>Konut uygulaması: giriş holü ve merdiven detayları</title><style>
*{transform-box:fill-box;transform-origin:center}
.s1{animation:s1 5s cubic-bezier(.22,1,.36,1) infinite}.s2{animation:s2 5s cubic-bezier(.22,1,.36,1) infinite}
.s3{animation:s3 5s cubic-bezier(.22,1,.36,1) infinite}.s4{animation:s4 5s cubic-bezier(.22,1,.36,1) infinite}
.s5{animation:s5 5s cubic-bezier(.22,1,.36,1) infinite}.x2{animation:x2 5s ease infinite}
.glow{animation:glow 1.5s ease-in-out infinite}.ray{stroke-dasharray:8 8;animation:ray 0.6s linear infinite}
@keyframes s1{0%,3%{opacity:0;transform:translateY(8px)}11%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes s2{0%,19%{opacity:0;transform:translateY(8px)}27%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes s3{0%,35%{opacity:0;transform:translateY(8px)}43%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes s4{0%,51%{opacity:0;transform:translateY(8px)}59%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes s5{0%,67%{opacity:0;transform:translateY(8px)}75%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
@keyframes x2{0%,19%{opacity:1}27%,100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ray{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect width="640" height="400" fill="#1d1c19"/>
    <path d="M40 330h560M40 60h560" stroke="#a29d93" stroke-width="3"/>
    <g class="s1"><rect x="60" y="80" width="170" height="250" fill="#e9e4da" fill-opacity=".9"/><rect x="92" y="128" width="72" height="202" fill="none" stroke="#b9b3a8" stroke-width="1.5"/><rect x="150" y="226" width="4" height="22" fill="#121110"/></g>
    <g class="s2"><path d="M250 330v-30h40v-30h40v-30h40v-30h40v-30h40v-30h30" fill="none" stroke="#ede9e1" stroke-width="4" stroke-linejoin="round"/><path d="M262 300L470 120v-60L262 240z" fill="#7fa6c9" fill-opacity=".22" stroke="#7fa6c9" stroke-width="2"/></g>
    <g class="s3"><rect x="490" y="80" width="110" height="250" fill="#b07a4f"/><path d="M512 80v250M534 80v250M556 80v250M578 80v250" stroke="#8f603c" stroke-width="2"/></g>
    <path class="s4 glow" d="M60 70h540" stroke="#f2c46b" stroke-width="5" stroke-linecap="round"/>
    <g class="s1"><circle cx="92" cy="128" r="14" fill="#c4825c"/><text x="92" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">1</text></g><g class="s2"><circle cx="470" cy="140" r="14" fill="#c4825c"/><text x="470" y="145" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">2</text></g><g class="s3"><circle cx="490" cy="96" r="14" fill="#c4825c"/><text x="490" y="101" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">3</text></g><g class="s4"><circle cx="330" cy="70" r="14" fill="#c4825c"/><text x="330" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">4</text></g></svg>
