    <g class="s1" fill="#2a2824" stroke="#ede9e1" stroke-width="3"><rect x="90" y="80" width="160" height="240"/><rect x="330" y="120" width="160" height="200"/></g>
    <g class="s1" stroke="#a29d93" stroke-width="1.5"><path d="M90 128h160M90 176h160M90 224h160M90 272h160M330 160h160M330 200h160M330 240h160M330 280h160"/></g>
    <g class="s2" fill="#b07a4f"><rect x="250" y="116" width="26" height="8"/><rect x="250" y="164" width="26" height="8"/><rect x="250" y="212" width="26" height="8"/><rect x="250" y="260" width="26" height="8"/><rect x="490" y="152" width="26" height="8"/><rect x="490" y="192" width="26" height="8"/><rect x="490" y="232" width="26" height="8"/><rect x="490" y="272" width="26" height="8"/></g>
    <g class="s3"><circle cx="596" cy="52" r="18" fill="#f2c46b"/><path class="ray" d="M580 62L276 120M580 66L276 216M582 70L516 160M584 74L516 260" stroke="#f2c46b" stroke-width="2"/></g>
    <g class="s4"><rect y="320" width="640" height="80" fill="#2c3324"/><path d="M56 352v26" stroke="#8a8478" stroke-width="4"/><circle cx="56" cy="346" r="18" fill="#4f6b3a"/><path d="M300 356v26" stroke="#8a8478" stroke-width="4"/><circle cx="300" cy="350" r="18" fill="#4f6b3a"/><path d="M560 352v26" stroke="#8a8478" stroke-width="4"/><circle cx="560" cy="346" r="18" fill="#4f6b3a"/><path d="M20 384h600" stroke="#8a8478" stroke-width="3" stroke-dasharray="10 8"/></g>
    <g class="s1"><circle cx="90" cy="80" r="14" fill="#c4825c"/><text x="90" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">1</text></g><g class="s2"><circle cx="276" cy="104" r="14" fill="#c4825c"/><text x="276" y="109" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">2</text></g><g class="s3"><circle cx="540" cy="52" r="14" fill="#c4825c"/><text x="540" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">3</text></g><g class="s4"><circle cx="150" cy="376" r="14" fill="#c4825c"/><text x="150" y="381" text-anchor="middle" font-size="15" font-weight="700" fill="#121110" font-family="ui-monospace,Menlo,monospace">4</text></g></svg>
