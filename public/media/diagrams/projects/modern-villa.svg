    <path d="M0 300h640" stroke="#a29d93" stroke-width="2"/>
    <g class="s1" fill="#e9e4da" fill-opacity=".9" stroke="#ede9e1" stroke-width="3" stroke-linejoin="round"><path d="M120 300V180l90-58 90 58v120z"/><path d="M320 300V160l90-66 90 66v140z"/></g>
    <g class="s2" fill="#2f3d47" stroke="#121110" stroke-width="4"><rect x="140" y="210" width="140" height="80"/><rect x="340" y="190" width="140" height="100"/><rect x="390" y="128" width="40" height="40"/></g>
    <g class="s4"><rect class="glow" x="144" y="214" width="132" height="72" fill="#f2c46b" fill-opacity=".55"/><rect class="glow" x="344" y="194" width="132" height="92" fill="#f2c46b" fill-opacity=".55"/></g>
