  <path d="M76 246h488" stroke="#4a453d" stroke-dasharray="3 5"/>
  <text x="40" y="276" fill="#eee5d6" font-family="Helvetica, Arial, sans-serif" font-size="13">Sıra ve süreler belediyeye, parsele ve yapı türüne göre değişir.</text>
  <text x="40" y="296" fill="#91877a" font-family="Helvetica, Arial, sans-serif" font-size="12">Bu şema bir süre taahhüdü değil, görüşmede kullanılacak bir yol haritasıdır.</text>
