name: Production smoke test

on:
  deployment_status:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check the live site
        run: npx playwright test e2e/site.spec.ts --project=desktop --grep "renders cleanly|internal link|404"
        env:
          BASE_URL: https://www.uplusstudio.com.tr

      - name: Keep test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
