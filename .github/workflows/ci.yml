name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          GMAIL_USER: ""
          GMAIL_PASS: ""
          CONTACT_EMAIL: ""

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          APPOINTMENT_SECRET: e2e-only-signing-key
          GMAIL_USER: ""
          GMAIL_PASS: ""

      - name: Keep test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
